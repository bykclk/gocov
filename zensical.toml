# Documentation site for docs.gocov.dev, built from docs/ — the same Markdown
# files that are read on GitHub. Nothing here changes docs/; the site is derived
# from it. Build locally with:
#
#   python3 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt
#   .venv/bin/zensical serve

[project]
site_name = "gocov"
site_url = "https://docs.gocov.dev/"
site_description = "Coverage tracking for pull requests — diff coverage, PR comments and merge gates for GitHub, GitLab and Bitbucket Cloud. Hosted at app.gocov.dev, or self-host a single Go binary."
site_author = "gocov"
copyright = "AGPL-3.0 © 2026"
repo_url = "https://github.com/gocov/gocov"
repo_name = "gocov/gocov"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
strict = true

nav = [
  { Home = "README.md" },
  { "Getting started" = "getting-started.md" },
  { "Migrating from Codecov or Coveralls" = "migrating.md" },
  { "Upload from CI" = [
    { "GitHub Actions" = "github-actions.md" },
    { "GitLab CI" = "gitlab-ci.md" },
    { "Bitbucket Pipelines" = "bitbucket-pipelines.md" },
    { "Other CI systems" = "ci-other.md" },
    { "Languages & formats" = "languages.md" },
  ] },
  { Features = [
    { "Pull requests" = "pull-requests.md" },
    { "Connect your forge" = "connecting.md" },
    { "Coverage gate" = "coverage-gate.md" },
    { Parts = "parts.md" },
    { "Ignoring files" = "ignoring-files.md" },
    { "Why coverage changed" = "coverage-changed.md" },
  ] },
  { Reference = [
    { CLI = "cli.md" },
    { "API & badge" = "api.md" },
  ] },
  { "Self-hosting" = [
    { "Production setup" = "self-hosting.md" },
    { "Sign-in" = "sign-in.md" },
    { "Forge apps & credentials" = "forge-connections.md" },
    { Configuration = "configuration.md" },
    { Development = "development.md" },
  ] },
]

# A dead link fails the build instead of reaching production. Both are on by
# default; spelled out because R4 of the docs-site plan rests on them.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
custom_dir = "overrides"
# System fonts, no Google Fonts request: it is the single biggest
# render-blocking resource on a phone, and a docs site that argues for
# keeping your data on your own infrastructure should not phone a third
# party to draw its text.
font = false
# The app's own mark, copied under overrides/ so docs/ stays Markdown. Same
# split the web UI makes: the header pairs the bare arc with the wordmark, the
# favicon carries the "g" because at 16px there is no room for words.
logo = "assets/gocov-mark.svg"
favicon = "assets/gocov.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gocov/gocov"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
